version: '4.1'
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=etterlevelsedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5433:5432

volumes:
  postgres: